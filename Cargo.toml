[package]
name = "splitflap-clock"
version = "0.1.0"
edition = "2021"
description = "A desktop clock that looks like an airport split-flap departure board"
publish = false

[[bin]]
name = "splitflap-clock"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.36"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
ron = "0.12"
