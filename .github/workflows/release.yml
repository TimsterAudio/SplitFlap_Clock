# Publishes a GitHub release whenever main carries a version (from
# Cargo.toml) that hasn't been released yet. Bump the version, add its
# section to CHANGELOG.md, push to main: the release `vX.Y.Z` appears with
# the Windows exe, the Linux binary, the Mac app, the user guide and
# BEER MONEY.TXT, and that section as its notes. A change to the guide, the
# changelog or BEER MONEY.TXT alone refreshes them on the latest release.

name: Release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - CHANGELOG.md
      - .github/workflows/release.yml
      - BEER MONEY.TXT
      - "Split-Flap Clock User Guide*"
      - tools/release_notes.sh
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$ver is already released."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false'
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            from: target/release/splitflap-clock
            to: splitflap-clock-linux-x86_64
          - os: windows-latest
            from: target/release/splitflap-clock.exe
            to: splitflap-clock.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - shell: bash
        run: mkdir dist && cp "${{ matrix.from }}" "dist/${{ matrix.to }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: dist/*
          retention-days: 7

  mac:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - run: tools/mac_app.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: bin-mac
          path: dist/*
          retention-days: 7

  publish:
    needs: [version, build, mac]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - name: Add the user guide
        run: |
          cp "Split-Flap Clock User Guide.html" dist/splitflap-clock-user-guide.html
          cp "Split-Flap Clock User Guide (dark).pdf" dist/splitflap-clock-user-guide-dark.pdf
          cp "Split-Flap Clock User Guide (light).pdf" dist/splitflap-clock-user-guide-light.pdf
          cp "BEER MONEY.TXT" dist/beer-money.txt
      - name: Release notes from CHANGELOG.md
        run: |
          tools/release_notes.sh "${{ needs.version.outputs.version }}" > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ needs.version.outputs.version }}"
          chmod +x dist/splitflap-clock-linux-x86_64
          gh release create "v$ver" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Split-Flap Clock $ver" \
            --notes-file notes.md

  # A release that's out already still gets the latest user guide, notes
  # and BEER MONEY.TXT, when they change: say, a new name in the thanks.
  refresh:
    needs: version
    if: github.ref == 'refs/heads/main' && needs.version.outputs.exists == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the guide, notes and beer money on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ needs.version.outputs.version }}"
          mkdir dist
          cp "Split-Flap Clock User Guide.html" dist/splitflap-clock-user-guide.html
          cp "Split-Flap Clock User Guide (dark).pdf" dist/splitflap-clock-user-guide-dark.pdf
          cp "Split-Flap Clock User Guide (light).pdf" dist/splitflap-clock-user-guide-light.pdf
          cp "BEER MONEY.TXT" dist/beer-money.txt
          gh release upload "v$ver" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          tools/release_notes.sh "$ver" > notes.md
          gh release edit "v$ver" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
