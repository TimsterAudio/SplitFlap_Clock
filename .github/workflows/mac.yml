# A one-off Mac build, for testing: the clock as a Mac app, for both Apple
# silicon and Intel Macs, as a download on the run's page (Actions, then
# the run, then Artifacts). It isn't signed by Apple, so the first time it
# needs opening by right-click, Open. It publishes nothing.

name: Mac

on:
  push:
    branches: [settings]
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - run: tools/mac_app.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: splitflap-clock-mac
          path: out/*
          retention-days: 30
